[project]
name = "my-pack"
version = "0.1.0"
description = "invoicing of purchase"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
my-pack = "my_pack.get_invoice:cli"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
